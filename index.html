<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Happy Place</title>
<style>
  * { box-sizing: border-box; }

  body {
    --page-bg: linear-gradient(135deg, #ffb6c8, #c6c5ff, #a8eee0);
    min-height: 100vh;
    margin: 0;
    padding: 28px 16px;
    font: 18px Arial, sans-serif;
    text-align: center;
    color: #39364d;
    background: var(--page-bg);
    transition: background 0.7s ease;
  }

  main { max-width: 1000px; margin: auto; }

  .card {
    padding: 26px 20px;
    background: #ffffffed;
    border: 1px solid white;
    border-radius: 24px;
    box-shadow: 0 12px 30px #443a7930;
  }

  .welcome {
    position: relative;
    height: 200px;
    margin-bottom: 22px;
    overflow: hidden;
  }

  .welcome h1 {
    position: absolute;
    top: 12px;
    left: 50%;
    margin: 8px 0;
    color: #5947b5;
    font-size: 2.3rem;
    white-space: nowrap;
    transform: translateX(-50%);
  }

  .welcome h1.bouncing { animation: bounceAround 3s ease-in-out infinite alternate; }

  @keyframes bounceAround {
    0%   { left: 20%; top: 10px; transform: rotate(-5deg); }
    25%  { left: 78%; top: 40px; transform: rotate(5deg); }
    50%  { left: 65%; top: 95px; transform: rotate(-4deg); }
    75%  { left: 25%; top: 90px; transform: rotate(4deg); }
    100% { left: 50%; top: 15px; transform: rotate(0); }
  }

  .welcome button { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); }
  .welcome button:hover { transform: translate(-50%, -3px); }

  .cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
  }

  h2 { color: #5947b5; }
  button {
    margin: 5px;
    padding: 12px 16px;
    border: 0;
    border-radius: 14px;
    color: white;
    background: linear-gradient(135deg, #7865e8, #a252cb);
    font-size: 16px;
    cursor: pointer;
    transition: transform .2s;
  }
  button:hover { transform: translateY(-3px); }
  .reply { min-height: 26px; color: #5947b5; font-weight: bold; }

  @media (max-width: 650px) {
    .cards { grid-template-columns: 1fr; }
    .welcome h1 { font-size: 1.8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main>
  <section class="card welcome">
    <h1 id="hello">Hello, World! 👋</h1>
    <button onclick="changeColors()">Change colors &amp; bounce! 🎨</button>
  </section>

  <div class="cards">
    <section class="card">
      <h2>Hello, friend! 🌈</h2>
      <p>How are you feeling today?</p>
      <p>Choose a mood for a little note 💌</p>
      <button onclick="show('moodReply','Keep smiling—you’re doing great! ✨')">😊 Great</button>
      <button onclick="show('moodReply','Take a slow breath. You’ve got this 🌿')">😌 Okay</button>
      <button onclick="show('moodReply','Sending you a warm, cozy hug 🤗')">😔 Not great</button>
      <p id="moodReply" class="reply">Pick a mood 💌</p>
    </section>

    <section class="card">
      <h2>A little reminder ✨</h2>
      <p id="quote">You’re allowed to grow at your own pace 🌱</p>
      <button onclick="newQuote()">Give me another quote 💌</button>
    </section>
</head>
<body>
    <section class="card">
      <h2>One tiny challenge 🎯</h2>
      <p id="challenge">Ready for a little fun?</p>
      <button onclick="newChallenge()">Surprise me!</button>
    </section>
  </div>
</main>

<script>
  const backgrounds = [
    "linear-gradient(135deg, #ffb6c8, #c6c5ff, #a8eee0)",
    "linear-gradient(135deg, #ffe29f, #ffa99f, #c8b6ff)",
    "linear-gradient(135deg, #a1c4fd, #c2e9fb, #fbc2eb)",
    "linear-gradient(135deg, #b7f8db, #a5d8ff, #f5c6ec)"
  ];
  let colorIndex = 0;

  function changeColors() {
    colorIndex = (colorIndex + 1) % backgrounds.length;
    document.body.style.setProperty("--page-bg", backgrounds[colorIndex]);
    document.getElementById("hello").classList.add("bouncing");
  }

  function show(id, message) {
    document.getElementById(id).textContent = message;
  }

  const quotes = [
    "You make the world brighter just by being you ☀️",
    "Small steps still move you forward 🌱",
    "A fresh start can begin at any moment 🌈",
    "You’ve made it through every tough day so far 💜"
  ];

  function newQuote() {
    show("quote", quotes[Math.floor(Math.random() * quotes.length)]);
  }

  const challenges = [
    "Smile for five seconds 😄",
    "Stretch your arms up like a star ⭐",
    "Think of one happy moment today 💛",
    "Give yourself a little high-five 🙌"
  ];

  function newChallenge() {
    show("challenge", challenges[Math.floor(Math.random() * challenges.length)]);
  }
</script>
</body>
</html>
